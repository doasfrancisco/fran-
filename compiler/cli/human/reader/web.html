<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Human</title>
<style>
  :root{
    --ground:#eef1f4; --surface:#fff; --surface-2:#f6f8fa; --ink:#151a22; --muted:#59636f;
    --faint:#8b95a1; --hair:#dde3e9; --spec:#0e7c86; --spec-wash:rgba(14,124,134,.11);
    --spec-wash-2:rgba(14,124,134,.05); --spec-line:rgba(14,124,134,.55); --call:#a15c00;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#0c0e13; --surface:#14181f; --surface-2:#191e27; --ink:#e7ebf1; --muted:#97a1af;
    --faint:#6c7684; --hair:#262d38; --spec:#3fd0dd; --spec-wash:rgba(63,208,221,.13);
    --spec-wash-2:rgba(63,208,221,.06); --spec-line:rgba(63,208,221,.55); --call:#e0a458; }}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
  main{height:100%;display:flex;gap:10px;padding:14px;}
  #side{flex:0 0 240px;display:flex;flex-direction:column;gap:10px;min-height:0;}
  #wrap{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;}
  .pane{background:var(--surface);border:1px solid var(--hair);border-radius:10px;overflow:hidden;}
  #projbar{display:flex;align-items:center;gap:9px;padding:8px 14px;font-size:13px;flex-shrink:0;}
  .caret{color:var(--faint);font-size:15px;line-height:1;}
  #projname{font-family:var(--mono);color:var(--muted);flex:1;}
  #treewrap{flex:1;min-height:0;display:flex;flex-direction:column;}
  #tree{flex:1;min-height:0;}
  #reader{flex:1;min-height:0;display:flex;flex-direction:column;}
  .phead{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--hair);padding:5px 14px;flex-shrink:0;}
  #head{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #menu{display:none;cursor:pointer;color:var(--faint);font-size:15px;line-height:1;padding:2px 4px;}
  .rows{flex:1;min-height:0;overflow:auto;padding:6px 0;display:grid;grid-auto-rows:min-content;align-content:start;}
  .bhead{font-family:var(--mono);font-size:11px;color:var(--muted);padding:10px 14px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .12s;}
  .bhead.closable{cursor:pointer;}
  .bhead.closable:hover{color:var(--spec);}
  .pill{font-family:var(--mono);font-size:11px;color:var(--faint);padding:6px 14px;}
  .chunk{font-family:var(--mono);font-size:13px;line-height:1.62;white-space:pre;padding:2px 14px;}
  .anch{color:var(--call);border-bottom:1px dashed var(--call);cursor:pointer;transition:color .12s;}
  .anch:hover{color:var(--spec);border-bottom-color:var(--spec);}
  .anch.off{color:var(--muted);border-bottom:1px dotted var(--faint);cursor:default;}
  .entry{transition:background .5s;}
  .entry.folded .body{display:none;}
  .entry.flash{background:var(--spec-wash);}
  .anch.flash{background:var(--spec-wash);color:var(--spec);}
  .bhead .caret{font-size:11px;}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;}
  #msg[hidden]{display:none;}
  #readwrap{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;}
  #shade{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.4);}
  .bhead{display:flex;align-items:center;gap:6px;}
  .bhead .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .queued{color:var(--spec);}
  .chunk.plain,.chunk.blank{cursor:text;}
  .chunk.blank{color:var(--faint);}
  .chunk textarea{display:block;width:100%;font:inherit;line-height:inherit;white-space:pre;overflow-wrap:normal;overflow-x:auto;overflow-y:hidden;background:transparent;color:var(--ink);border:0;outline:0;padding:0;margin:0;resize:none;tab-size:4;}
  .pill.note{white-space:pre-wrap;}
  .pill.bad{color:var(--call);}
  #state{color:var(--faint);}
  #go{color:var(--spec);border:1px solid var(--spec-line);border-radius:999px;padding:1px 9px;cursor:pointer;}
  #go[hidden]{display:none;}
  #go.busy{opacity:.5;cursor:default;}
  @media (max-width:720px){
    main{padding:8px;gap:8px;}
    #menu{display:inline-block;}
    #side{position:fixed;top:0;bottom:0;left:0;width:min(78vw,300px);z-index:20;background:var(--ground);padding:8px;transform:translateX(-105%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.25);}
    #side.open{transform:none;}
    .chunk{font-size:12px;line-height:1.55;padding:2px 10px;}
    .bhead,.phead{padding-left:10px;padding-right:10px;}
    .pill{padding:6px 10px;}
  }
</style>
</head>
<body>
<main>
  <div id="side">
    <section class="pane" id="projbar"><span id="projname"></span></section>
    <section class="pane" id="treewrap"><div id="tree"></div></section>
  </div>
  <div id="wrap">
    <div id="readwrap">
      <section class="pane" id="reader"><div class="phead"><span id="menu">☰</span><span id="head"></span><span id="state"></span><span id="go" hidden>compile</span></div><div class="rows" id="rows"></div></section>
      <div id="msg" hidden></div>
    </div>
  </div>
</main>
<div id="shade" hidden></div>
<script type="module">
import { FileTree } from "./trees.js";

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
var ANCH=/\[([^\[\]]+)\]\(([^()]+)\)/g;
var projs=[], cur=null, byId={}, blockId={}, order=[], lines=[], ft=null, openSet={}, openMem={}, notice="";
var editing=null, typed={}, pendingBy={}, sending=false, bad=false, caretWanted=0;
var rows=document.getElementById("rows");

function msg(t){var el=document.getElementById("msg");el.hidden=!t;el.textContent=t||"";}

var side=document.getElementById("side"), shade=document.getElementById("shade");
function drawer(on){side.classList.toggle("open",on);shade.hidden=!on;}
document.getElementById("menu").addEventListener("click",function(){drawer(!side.classList.contains("open"));});
shade.addEventListener("click",function(){drawer(false);});

fetch("human.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(h){
  if(h.code_file) document.title="Human · "+h.code_file;
  var names=h.files||[];
  return Promise.all(names.map(function(f){
    return fetch("explanation_"+f.replace(/\//g,"__")+".json",{cache:"no-store"})
      .then(function(r){return r.ok?r.json():null;})
      .catch(function(){return null;})
      .then(function(d){
        if(!d||!Array.isArray(d.explanations))
          d={explanations:[],not_covered:{code_lines:[],blank_lines:[]}};
        return {file:f,d:d,code:null};
      });
  })).then(function(fs){
    return fetch("project.json",{cache:"no-store"})
      .then(function(r){return r.ok?r.json():null;})
      .catch(function(){return null;})
      .then(function(pj){
        if(pj&&Array.isArray(pj.explanations)) fs.unshift({file:"human/project.json",d:pj,code:null});
        fs.unshift({file:"human/human.json",d:h,code:null});
        return fs.length?{name:h.code_file||"project",files:fs}:null;
      });
  });
}).then(function(p){
  if(!p){msg("no files — run human init at the project root");return;}
  projs=[p];
  var start=p.files[0];
  buildTree(p,start.file);
  open(p,start);
}).catch(function(){msg("could not load — run human serve at the project root");});

function buildTree(p,sel){
  var box=document.getElementById("tree");
  if(ft&&ft.cleanUp) ft.cleanUp();
  box.innerHTML="";
  var ex=[], acc="";
  sel.split("/").slice(0,-1).forEach(function(d){acc=acc?acc+"/"+d:d;ex.push(acc);});
  ft=new FileTree({paths:p.files.map(function(f){return f.file;}),initialExpansion:"closed",
    initialExpandedPaths:ex,
    initialSelectedPaths:[sel],
    onSelectionChange:function(){
      if(!cur) return;
      var s=ft.getSelectedPaths()[0];
      if(!s||s===cur.file) return;
      var f=fileOf(s);
      if(f) open(cur.proj,f);
    }});
  ft.render({fileTreeContainer:box});
}

function open(p,f){
  cur={proj:p,name:p.name,file:f.file,d:f.d,code:f.code};
  document.getElementById("projname").textContent=p.name;
  lines=f.code?f.code.replace(/\n$/,"").split("\n"):[];
  openSet=openMem[p.name+"/"+f.file]=openMem[p.name+"/"+f.file]||{};
  byId={}; blockId={}; notice="";
  if(editing&&editing.file!==f.file) editing=null;
  f.d.explanations.forEach(function(e){
    byId[e.id]=e;
    if(!(e.block in blockId)) blockId[e.block]=e.id;
  });
  order=sorted(f.d.explanations);
  msg("");
  drawer(false);
  render();
  if(f.code===null&&!f.d.explanations.length) loadCode(p,f);
}

function loadCode(p,f){
  fetch("../"+f.file,{cache:"no-store"})
    .then(function(r){return r.ok?r.text():null;})
    .then(function(t){
      f.code=t===null?"":t;
      if(!cur||cur.proj!==p||cur.file!==f.file) return;
      cur.code=f.code;
      lines=f.code?f.code.replace(/\n$/,"").split("\n"):[];
      render();
    })
    .catch(function(){});
}

function fileOf(name){
  var f=null;
  if(cur) cur.proj.files.forEach(function(x){if(x.file===name)f=x;});
  return f;
}

function crossEntry(fname,bname){
  var f=fileOf(fname), has=false;
  if(f) f.d.explanations.forEach(function(e){if(e.block===bname)has=true;});
  return has;
}

function crossAnchor(fname,eid,words){
  var f=fileOf(fname), has=false;
  if(f) f.d.explanations.forEach(function(e){
    if(e.id===eid) (e.anchors||[]).forEach(function(a){if(a.words===words)has=true;});
  });
  return has;
}

function targetOf(a){
  if(a.file) return null;
  if(a.explanation) return byId[a.explanation]?a.explanation:null;
  var t=blockId[a.block];
  return t===undefined?null:t;
}

function sorted(es){
  var depth={}, refs={};
  es.forEach(function(e){
    depth[e.id]=0;
    (e.anchors||[]).forEach(function(a){
      var t=targetOf(a);
      if(t&&t!==e.id){refs[t]=refs[t]||[];refs[t].push(e.id);}
    });
  });
  for(var k=0;k<es.length;k++){
    var moved=false;
    es.forEach(function(e){
      (refs[e.id]||[]).forEach(function(r){
        if(depth[r]+1>depth[e.id]){depth[e.id]=depth[r]+1;moved=true;}
      });
    });
    if(!moved) break;
  }
  return es.slice().sort(function(x,y){
    return depth[y.id]-depth[x.id]||startOf(x)-startOf(y)||x.id-y.id;
  });
}

function anchorByWords(e,w){
  var found=null;
  (e.anchors||[]).forEach(function(a){if(a.words===w)found=a;});
  return found;
}

function guessAnchor(t){
  t=t.trim();
  var em=/^e(\d+):(.+)$/.exec(t);
  if(em) return {explanation:+em[1],anchor:em[2]};
  if(t in blockId) return {block:t};
  var i=t.indexOf(":"), fn=i<0?t:t.slice(0,i), rest=i<0?null:t.slice(i+1);
  if(!fileOf(fn)) return null;
  if(rest===null) return {file:fn};
  var fe=/^e(\d+):(.+)$/.exec(rest);
  return fe?{file:fn,entry:+fe[1],anchor:fe[2]}:{file:fn,block:rest};
}

function startOf(e){return Math.min.apply(null,e.block_lines.map(function(r){return r[0];}));}

function fmtSpans(e){
  return e.block_lines.map(function(r){return r[0]===r[1]?String(r[0]):r[0]+"–"+r[1];}).join(", ");
}

function lineHtml(e,l){
  var out="", last=0, m;
  ANCH.lastIndex=0;
  while((m=ANCH.exec(l))){
    out+=esc(l.slice(last,m.index));
    var w=m[1].trim(), a=anchorByWords(e,w)||guessAnchor(m[2]);
    if(a&&a.file&&a.entry){
      if(crossAnchor(a.file,a.entry,a.anchor))
        out+='<span class="anch" data-file="'+esc(a.file)+'" data-entry="'+a.entry+'" data-words="'+esc(a.anchor)+'">'+esc(m[1])+'</span>';
      else
        out+='<span class="anch off">'+esc(m[1])+' ('+esc(a.file)+':e'+a.entry+')</span>';
      last=m.index+m[0].length;
      continue;
    }
    if(a&&a.file){
      if(fileOf(a.file)&&(!a.block||crossEntry(a.file,a.block)))
        out+='<span class="anch" data-file="'+esc(a.file)+'"'
          +(a.block?' data-block="'+esc(a.block)+'"':'')+'>'+esc(m[1])+'</span>';
      else
        out+='<span class="anch off">'+esc(m[1])+(a.block?' ('+esc(a.block)+')':'')+'</span>';
      last=m.index+m[0].length;
      continue;
    }
    var t=a?targetOf(a):null;
    if(t&&t!==e.id)
      out+='<span class="anch" data-kind="'+(a.explanation?"swap":"zoom")+'" data-child="'+t+'">'+esc(m[1])+'</span>';
    else
      out+='<span class="anch off">'+esc(m[1])+'</span>';
    last=m.index+m[0].length;
  }
  out+=esc(l.slice(last));
  return out;
}

function nameOf(file){
  if(file==="human/project.json") return "project";
  if(file==="human/human.json") return null;
  return file;
}

function key(file,kind,id){return "human-draft:"+cur.name+"/"+file+"/"+(id===null?kind:id);}

function baseText(kind,id){return kind==="retext"?byId[id].text:kind==="code"?(cur.code||""):"";}

function shownText(kind,id){
  var k=key(cur.file,kind,id);
  if(k in typed) return typed[k];
  var s=localStorage.getItem(k);
  return s!==null?s:baseText(kind,id);
}

function changed(kind,id){return shownText(kind,id)!==baseText(kind,id);}

function unsaved(kind,id){
  var k=key(cur.file,kind,id);
  if(!(k in typed)) return false;
  var s=localStorage.getItem(k);
  return typed[k]!==(s!==null?s:baseText(kind,id));
}

function slots(){
  var name=nameOf(cur.file);
  if(!name) return [];
  if(!cur.d.explanations.length){
    var s=[{kind:"map",id:null}];
    if(name!=="project"&&cur.code!==null) s.push({kind:"code",id:null});
    return s;
  }
  var out=name==="project"?[{kind:"map",id:null}]:[];
  order.forEach(function(e){out.push({kind:"retext",id:e.id});});
  return out;
}

function queuedMark(name,id){
  var q=(pendingBy[name]||[]).filter(function(x){return id===undefined||x.entry===id;});
  return q.length?' <span class="queued">· compiling'+(q.length>1?" ×"+q.length:"")+'</span>':"";
}

function isEditing(kind,id){return !!editing&&editing.kind===kind&&editing.id===id;}

function editorHtml(text){
  return '<div class="chunk edit"><textarea spellcheck="false">'+esc(text)+'</textarea></div>';
}

function mapSlotHtml(name,blank){
  if(isEditing("map",null)) return editorHtml(shownText("map",null));
  var t=shownText("map",null);
  if(!t) return '<div class="chunk blank" data-edit="map">'+blank+'</div>';
  return '<div class="chunk plain" data-edit="map">'+t.split("\n").map(function(l){return lineHtml({id:null,anchors:[]},l);}).join("\n")+'</div>';
}

function codeSlotHtml(){
  var t=shownText("code",null);
  if(isEditing("code",null)) return editorHtml(t);
  var ls=t?t.replace(/\n$/,"").split("\n"):[];
  if(!ls.length) return "";
  var pad=String(ls.length).length;
  return '<div class="chunk plain" data-edit="code">'+esc(ls.map(function(l,i){return String(i+1).padStart(pad)+"  "+l;}).join("\n"))+'</div>';
}

function header(){
  var any=false, dirty=false;
  slots().forEach(function(s){
    if(changed(s.kind,s.id)) any=true;
    if(unsaved(s.kind,s.id)) dirty=true;
  });
  document.getElementById("state").textContent=dirty?"unsaved":"";
  var go=document.getElementById("go");
  go.hidden=!any&&!sending;
  go.classList.toggle("busy",sending);
}

function render(){
  var ta=rows.querySelector(".chunk textarea");
  if(editing&&ta) keep(ta.value);
  var name=nameOf(cur.file);
  var html=notice?'<div class="pill note'+(bad?" bad":"")+'">'+esc(notice)+'</div>':"";
  if(!cur.d.explanations.length){
    var word=cur.code===null?"loading the file":"no abstraction for this file yet";
    if(name&&cur.code!==null){
      html+=mapSlotHtml(name,"write an abstraction");
      if(name!=="project") html+=codeSlotHtml();
    }else if(lines.length){
      var pad=String(lines.length).length;
      html+='<div class="chunk">'+esc(lines.map(function(l,i){return String(i+1).padStart(pad)+"  "+l;}).join("\n"))+'</div>';
    }
    rows.innerHTML=html;
    document.getElementById("head").innerHTML=esc(cur.name+"/"+cur.file+"  ·  "+word)+queuedMark(name);
    header(); focusEditor();
    return;
  }
  var opened=0;
  if(name==="project"){
    var t=shownText("map",null);
    if(t||isEditing("map",null)) html+='<div class="bhead"><span class="label">new abstraction'+queuedMark(name,null)+'</span></div>';
    html+=mapSlotHtml(name,"new abstraction"+queuedMark(name,null));
  }
  order.forEach(function(e){
    var on=!!openSet[e.id]||isEditing("retext",e.id);
    if(on) opened++;
    var spans=fmtSpans(e);
    html+='<div class="entry'+(on?'':' folded')+'" data-entry="'+e.id+'">'
      +'<div class="bhead closable" data-fold="'+e.id+'"><span class="caret">'+(on?'▾':'▸')+'</span><span class="label">'
      +esc(e.block)+(spans?' · '+spans:"")+queuedMark(name,e.id)+'</span></div>'
      +'<div class="body">'+(isEditing("retext",e.id)?editorHtml(shownText("retext",e.id))
        :'<div class="chunk'+(name?' plain" data-edit="retext" data-id="'+e.id:'')+'">'
          +shownText("retext",e.id).split("\n").map(function(l){return lineHtml(e,l);}).join("\n")+'</div>')
      +'</div></div>';
  });
  var bare=(cur.d.not_covered&&cur.d.not_covered.code_lines||[]).length;
  if(bare) html+='<div class="pill">▹ '+bare+' bare lines</div>';
  rows.innerHTML=html;
  document.getElementById("head").textContent=
    cur.name+"/"+cur.file+"  ·  "+opened+"/"+cur.d.explanations.length+" open";
  header(); focusEditor();
}

function fit(ta){ta.style.height="auto";ta.style.height=ta.scrollHeight+"px";}

function focusEditor(){
  var ta=rows.querySelector(".chunk textarea");
  if(!ta) return;
  fit(ta);
  ta.focus();
  var pos=Math.min(caretWanted,ta.value.length);
  ta.setSelectionRange(pos,pos);
}

function keep(text){
  var k=key(editing.file,editing.kind,editing.id);
  if(text!==shownText(editing.kind,editing.id)||k in typed) typed[k]=text;
}

function caretAt(ev,el){
  var node=null, off=0;
  if(document.caretPositionFromPoint){
    var p=document.caretPositionFromPoint(ev.clientX,ev.clientY);
    if(p){node=p.offsetNode;off=p.offset;}
  }else if(document.caretRangeFromPoint){
    var c=document.caretRangeFromPoint(ev.clientX,ev.clientY);
    if(c){node=c.startContainer;off=c.startOffset;}
  }
  if(!node||!el.contains(node)) return 0;
  var r=document.createRange();
  r.setStart(el,0); r.setEnd(node,off);
  return r.toString().length;
}

function rawOffset(text,shown){
  var seen=0, last=0, m;
  ANCH.lastIndex=0;
  while((m=ANCH.exec(text))){
    var plain=m.index-last;
    if(seen+plain>=shown) return last+(shown-seen);
    seen+=plain;
    if(seen+m[1].length>=shown) return m.index+1+(shown-seen);
    seen+=m[1].length;
    last=m.index+m[0].length;
  }
  return Math.min(text.length,last+(shown-seen));
}

function codeOffset(text,shown){
  var ls=text.replace(/\n$/,"").split("\n"), pad=String(ls.length).length+2, at=0;
  for(var i=0;i<ls.length;i++){
    var w=pad+ls[i].length+1;
    if(shown<w) return at+Math.max(0,shown-pad);
    shown-=w; at+=ls[i].length+1;
  }
  return text.length;
}

function startEdit(kind,id,ev,el){
  var text=shownText(kind,id), at=caretAt(ev,el);
  caretWanted=kind==="code"?codeOffset(text,at):rawOffset(text,at);
  editing={file:cur.file,kind:kind,id:id};
  render();
}

function leaveEdit(text){
  if(!editing) return;
  keep(text);
  editing=null;
  caretWanted=0;
  render();
}

function save(){
  if(!cur) return;
  var ta=rows.querySelector(".chunk textarea");
  if(editing&&ta) keep(ta.value);
  slots().forEach(function(s){
    var k=key(cur.file,s.kind,s.id);
    if(!(k in typed)) return;
    if(typed[k]===baseText(s.kind,s.id)) localStorage.removeItem(k); else localStorage.setItem(k,typed[k]);
    delete typed[k];
  });
  header();
}

function reloadMap(f){
  var url=f.file==="human/project.json"?"project.json":"explanation_"+f.file.replace(/\//g,"__")+".json";
  return fetch(url,{cache:"no-store"}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
    .then(function(d){
      if(d&&Array.isArray(d.explanations)) f.d=d;
      if(cur&&cur.file===f.file) open(cur.proj,f);
    });
}

function compile(){
  if(!cur||sending) return;
  var ta=rows.querySelector(".chunk textarea");
  if(editing&&ta) keep(ta.value);
  var todo=slots().filter(function(s){return changed(s.kind,s.id);});
  if(!todo.length) return;
  var f=fileOf(cur.file), name=nameOf(cur.file), file=cur.file;
  var texts=todo.map(function(s){return shownText(s.kind,s.id);});
  sending=true; bad=false; notice="compiling…"; editing=null;
  render();
  var says=[], failed=false, codeOk=false;
  var done=function(){
    sending=false;
    var show=function(){notice=says.join("\n");bad=failed;render();pollQueue();};
    if(!cur||cur.file!==file){show();return;}
    if(codeOk) open(cur.proj,f);
    reloadMap(f).then(show);
  };
  var step=function(i){
    if(i>=todo.length){done();return;}
    var s=todo[i], body={name:name,kind:s.kind,id:s.id,text:texts[i]};
    var label=s.kind==="code"?"the code":s.kind==="map"?"the abstraction":"entry "+s.id;
    fetch("compile",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(x){
        if(!x.ok){says.push(label+": "+(x.j.error||"refused"));failed=true;step(i+1);return;}
        var k=key(file,s.kind,s.id);
        localStorage.removeItem(k); delete typed[k];
        if(s.kind==="code"){f.code=body.text;codeOk=true;}
        says.push(x.j.output+(x.j.seq?"  ·  event "+x.j.seq+" waits for claude":""));
        step(i+1);
      })
      .catch(function(){says.push(label+": the server did not answer — is human serve running?");failed=true;step(i+1);});
  };
  step(0);
}

function pollQueue(){
  fetch("server/queue",{cache:"no-store"}).then(function(r){return r.json();}).then(function(q){
    var by={};
    q.pending.forEach(function(x){(by[x.name]=by[x.name]||[]).push(x);});
    var same=JSON.stringify(by)===JSON.stringify(pendingBy);
    pendingBy=by;
    if(!same&&cur&&!editing) render();
  }).catch(function(){});
}
setInterval(pollQueue,3000);

function jump(id){
  openSet[id]=1;
  render();
  var el=rows.querySelector('[data-entry="'+id+'"]');
  if(!el) return;
  el.scrollIntoView({behavior:"smooth",block:"start"});
  el.classList.add("flash");
  setTimeout(function(){el.classList.remove("flash");},900);
}

function flashAnchor(id,words){
  var el=rows.querySelector('[data-entry="'+id+'"]');
  if(!el) return;
  var hit=null;
  el.querySelectorAll(".anch").forEach(function(sp){if(!hit&&sp.textContent.trim()===words)hit=sp;});
  if(!hit) return;
  hit.scrollIntoView({behavior:"smooth",block:"center"});
  hit.classList.add("flash");
  setTimeout(function(){hit.classList.remove("flash");},900);
}

function crossJump(fname,bname,eid,words){
  var f=fileOf(fname);
  if(!f) return;
  open(cur.proj,f);
  buildTree(cur.proj,fname);
  if(!f.d.explanations.length){render();return;}
  var id=null;
  if(eid){
    if(!byId[eid]){notice="no entry "+eid+" in this map";render();return;}
    jump(eid);
    setTimeout(function(){flashAnchor(eid,words);},50);
    return;
  }
  if(bname){
    id=blockId[bname];
    if(id===undefined){notice="no entry for "+bname+" yet";render();return;}
  }else{
    f.d.explanations.forEach(function(e){
      if(e.block===f.file&&(id===null||e.id<id)) id=e.id;
    });
    if(id===null&&order.length) id=order[order.length-1].id;
  }
  if(id!=null) jump(id);
}

rows.addEventListener("input",function(ev){
  if(!editing||!ev.target.matches(".chunk textarea")) return;
  keep(ev.target.value);
  fit(ev.target);
  header();
});

rows.addEventListener("focusout",function(ev){
  if(editing&&ev.target.isConnected&&ev.target.matches(".chunk textarea")) leaveEdit(ev.target.value);
});

rows.addEventListener("mousedown",function(ev){
  if(ev.button!==0||ev.target.closest("textarea")||ev.target.closest(".anch[data-file],.anch[data-child]")) return;
  var ch=ev.target.closest(".chunk[data-edit]");
  if(!ch) return;
  ev.preventDefault();
  var ta=rows.querySelector(".chunk textarea");
  if(editing&&ta) keep(ta.value);
  startEdit(ch.getAttribute("data-edit"),ch.hasAttribute("data-id")?+ch.getAttribute("data-id"):null,ev,ch);
});

rows.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"&&ev.target.matches(".chunk textarea")) ev.target.blur();
});

document.addEventListener("keydown",function(ev){
  if((ev.ctrlKey||ev.metaKey)&&!ev.altKey&&ev.key.toLowerCase()==="s"){ev.preventDefault();save();}
});

document.getElementById("go").addEventListener("click",function(){compile();});

rows.addEventListener("click",function(ev){
  if(ev.target.closest("textarea")) return;
  var xf=ev.target.closest(".anch[data-file]");
  if(xf){
    var ce=xf.getAttribute("data-entry");
    crossJump(xf.getAttribute("data-file"),xf.getAttribute("data-block"),ce?+ce:null,xf.getAttribute("data-words"));
    return;
  }
  var an=ev.target.closest(".anch[data-child]");
  if(an){jump(+an.getAttribute("data-child"));return;}
  if(ev.target.closest(".chunk[data-edit]")) return;
  var fd=ev.target.closest(".bhead[data-fold]");
  if(fd){
    var id=+fd.getAttribute("data-fold");
    if(openSet[id]) delete openSet[id]; else openSet[id]=1;
    render();
  }
});
</script>
</body>
</html>
